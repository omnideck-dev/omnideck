[project]
name = "computron-9000"
version = "0.1.0"
description = "A modern, extensible AI assistant platform with a responsive chat UI and Python backend."
requires-python = ">=3.12"
dependencies = [
    "aiohttp",
    "pydantic",
    "pyyaml",
    "playwright==1.52.0",
    "beautifulsoup4",
    "ollama>=0.6",
    "cachetools>=5.5.2",
    "python-dotenv>=1.1.0",
    "html2text>=2025.4.15",
    "rich>=14.3.3",
    "anthropic>=0.52.0",
    "openai>=1.40.0,<2",
    "croniter>=1.3",
    "cryptography>=46.0.7",
    "caldav>=1.3",
    "trafilatura>=2.0",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.130",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0,<8.0.0",
    "pytest-asyncio",
    "pytest-aiohttp",
    "pytest-watch",
    "pytest-playwright",
    "pytest-xdist",
]
dev = [
    "ruff",
    "mypy",
    "types-cachetools",
    "types-croniter",
    "types-oauthlib",
    "types-PyYAML"
]

[tool.uv]
# uv-specific settings can go here

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "tests",
    "tests/**",
    "repls",
    "repls/**",
]

[tool.ruff.lint]
select = [
    # Syntax and name errors that are very likely to break at runtime.
    "E9",
    "F63",
    "F7",
    "F82",
    # High-confidence correctness bugs (mutable defaults, loop captures, etc.).
    "B",
]
ignore = [
    # These require contextual judgment and produce noise in this codebase.
    "B904",
    "B905",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_unused_configs = true
warn_no_return = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
no_implicit_reexport = true
ignore_missing_imports = false
follow_imports = "skip"
namespace_packages = true
explicit_package_bases = true
show_error_codes = true
pretty = true
exclude = "^(tests|repls|container|migrations|desktop/tests)/"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["integrations.brokers.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
warn_untyped_fields = true
init_typed = true
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-config",
    "-q",
    "--no-header",
    "--disable-warnings",
]
asyncio_mode = "auto"
log_cli = false
log_cli_level = "ERROR"
log_level = "WARNING"


[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicitly include our flat-layout top-level packages
include = [
    "agent_runtime*",
    "agent_core*",
    "providers*",
    "skills*",
    "agents*",
    "browser*",
    "config*",
    "migrations*",
    "models*",
    "custom_apps*",
    "repls*",
    "server*",
    "tasks*",
    "tools*",
    "utils*",
]
exclude = [
    "tests*",
]

[tool.setuptools.package-data]
"agent_core.skills" = ["default_skills/*.json"]
"tools.browser" = ["capability.json"]
