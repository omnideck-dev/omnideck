name: Release-note policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Release preparation PR to validate
        required: true
        type: number
  push:
    branches: [main]

concurrency:
  group: release-note-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  release-note-policy:
    name: release-note-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Test release-note tooling
        run: node --test tests/release-notes.test.mjs tests/weekly-app-release.test.mjs

      - name: Validate stored fragments
        run: node scripts/release-notes.mjs validate-fragments

      - name: Validate pull request metadata
        if: github.event_name == 'pull_request'
        run: node scripts/release-notes.mjs validate-pr

      - name: Validate dispatched release PR metadata
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '{pull_request: .}' > "$RUNNER_TEMP/release-pr-event.json"
          test "$(jq -r .pull_request.head.sha "$RUNNER_TEMP/release-pr-event.json")" = "$(git rev-parse HEAD)"
          test "$(jq -r .pull_request.base.ref "$RUNNER_TEMP/release-pr-event.json")" = main
          GITHUB_EVENT_PATH="$RUNNER_TEMP/release-pr-event.json" node scripts/release-notes.mjs validate-pr
