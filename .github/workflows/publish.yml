name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Tests gate everything. They run on PRs and pushes; the image is only built
  # and published on pushes, and only after all three test jobs pass.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Python version comes from .python-version (3.12.10); --frozen installs
      # exactly what uv.lock pins, with no re-resolution.
      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Run unit tests
        run: just unit

  browser-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra test

      # This suite drives the browser tools and DOM walker against local HTML
      # fixtures, so Chromium and its system libraries must be present.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Run browser-tools tests
        run: just test-browser-tools

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      # Node 24 tracks the container's LTS line (it installs the latest LTS,
      # currently 24.x). `cache-dependency-path` keys the npm cache on the lockfile.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/ui/package-lock.json

      - name: Run UI tests
        run: just test-ui run

  # Full-stack e2e against the image that was just built, by digest, before
  # any tag points at it — so a commit that fails here never becomes the image
  # anyone pulls. `just e2e` runs the app with MOCK_LLM=1 (in-process
  # FakeProvider — no Ollama, GPU, or API keys) and drives the real UI with
  # Playwright from the host. The image was built from this same commit, so its
  # baked source/deps/UI already match the checkout.
  e2e-tests:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen --extra test

      # Tests run a browser on the host against the containerized app, so the
      # runner needs Chromium and its system libraries.
      - name: Install Playwright browser
        run: uv run playwright install --with-deps chromium

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the digest built for this runner's architecture
        uses: actions/download-artifact@v8
        with:
          name: digests-linux-amd64
          path: /tmp/digests

      - name: Pull the image by digest
        id: image
        run: |
          digest=$(cat /tmp/digests/linux-amd64.txt)
          image="ghcr.io/${{ github.repository }}@${digest}"
          docker pull "${image}"
          echo "ref=${image}" >> "$GITHUB_OUTPUT"

      # E2E_SKIP_BUILD runs the pulled image as-is instead of building one.
      - name: Run e2e tests
        env:
          E2E_IMAGE: ${{ steps.image.outputs.ref }}
          E2E_SKIP_BUILD: "1"
        run: just e2e

  # Build each platform natively on its own runner — no QEMU emulation.
  build:
    needs: [unit-tests, browser-tools, ui-tests]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image version metadata
        id: version
        shell: bash
        run: echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            OMNIDECK_VERSION=${{ steps.version.outputs.value }}
          # Push by digest only — tags applied in the merge job.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Store digest
        id: platform
        run: |
          mkdir -p /tmp/digests
          platform=${{ matrix.platform }}
          slug="${platform//\//-}"
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${slug}.txt"
          echo "slug=${slug}" >> "$GITHUB_OUTPUT"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*.txt
          retention-days: 1

  # Merge per-platform images into a single multi-arch manifest and tag it.
  # Runs after e2e so latest never points at an image that failed it.
  merge:
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" \
            $(printf 'ghcr.io/${{ github.repository }}@%s ' $(cat /tmp/digests/*.txt))
