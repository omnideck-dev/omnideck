name: Release container
run-name: Release container ${{ inputs.version || 'weekly auto-version' }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  schedule:
    - cron: '0 10 * * 1'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z override; leave blank to auto-version accumulated app changes'
        required: false
        type: string
      dry_run:
        description: 'Preview the version, notes, and release record without publishing'
        default: false
        type: boolean

concurrency:
  group: omnideck-container-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release tooling
        run: |
          node --test tests/release-notes.test.mjs tests/weekly-app-release.test.mjs tests/publish-app-release.test.mjs
          node scripts/release-notes.mjs validate-fragments

      - name: Read published container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp \
            "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/omnideck/versions?per_page=100" \
            > "$RUNNER_TEMP/app-tags.json"

      - name: Read app release records (including drafts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > "$RUNNER_TEMP/app-releases.json"

      - name: Plan release
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRE_ONE_BREAKING: minor
        run: node scripts/weekly-app-release.mjs plan "$RUNNER_TEMP/app-release.json" "$RUNNER_TEMP/app-tags.json" "$RUNNER_TEMP/app-releases.json"

      - name: Verify exact source CI
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?head_sha=${SOURCE_SHA}&event=push&branch=main&per_page=100" \
            > "$RUNNER_TEMP/app-ci.json"
          node scripts/weekly-app-release.mjs verify-ci "$RUNNER_TEMP/app-release.json" "$RUNNER_TEMP/app-ci.json"

      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tested image
        if: steps.plan.outputs.skip != 'true'
        id: image
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          source_image="ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA:0:7}"
          source_digest=$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')
          [[ "$source_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Publish app release and promote tested image
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/publish-app-release.mjs "$RUNNER_TEMP/app-release.json"
