name: Release container
run-name: Release container ${{ inputs.version || 'weekly auto-version' }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  schedule:
    - cron: '0 10 * * 5'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z override; leave blank to auto-version accumulated app changes'
        required: false
        type: string
      dry_run:
        description: 'Preview the version and notes without committing or publishing'
        default: false
        type: boolean

concurrency:
  group: omnideck-container-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read
  packages: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # The bot pushes only generated notes and their source record. App
          # code is promoted from an earlier, already-tested main commit.
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Test release tooling
        run: |
          node --test tests/release-notes.test.mjs tests/weekly-app-release.test.mjs
          node scripts/release-notes.mjs validate-fragments

      - name: Read published container versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --paginate --slurp \
            "orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/omnideck/versions?per_page=100" \
            > "$RUNNER_TEMP/app-tags.json"

      - name: Plan release
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          PRE_ONE_BREAKING: minor
        run: node scripts/weekly-app-release.mjs plan "$RUNNER_TEMP/app-release.json" "$RUNNER_TEMP/app-tags.json"

      - name: Verify exact source CI
        if: steps.plan.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/runs?head_sha=${SOURCE_SHA}&event=push&branch=main&per_page=100" \
            > "$RUNNER_TEMP/app-ci.json"
          node scripts/weekly-app-release.mjs verify-ci "$RUNNER_TEMP/app-release.json" "$RUNNER_TEMP/app-ci.json"

      - uses: docker/setup-buildx-action@v4
        if: steps.plan.outputs.skip != 'true'

      - uses: docker/login-action@v4
        if: steps.plan.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tested image
        if: steps.plan.outputs.skip != 'true'
        id: image
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          source_image="ghcr.io/${GITHUB_REPOSITORY}:main-${SOURCE_SHA:0:7}"
          source_digest=$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')
          [[ "$source_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$source_digest" >> "$GITHUB_OUTPUT"

      - name: Commit generated release notes
        if: steps.plan.outputs.prepare == 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # A concurrent main push makes this fast-forward push fail. Replan
          # on rerun; never overwrite code or silently change the release source.
          node scripts/weekly-app-release.mjs prepare "$RUNNER_TEMP/app-release.json"
          node scripts/release-notes.mjs check-consumed --target app
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(release): prepare app ${VERSION}"
          git push origin HEAD:refs/heads/main

      - name: Promote tested image
        if: steps.plan.outputs.skip != 'true' && !inputs.dry_run
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          release_image="ghcr.io/${GITHUB_REPOSITORY}:${VERSION}"
          if release_digest=$(docker buildx imagetools inspect \
            "$release_image" --format '{{.Manifest.Digest}}' 2>"$RUNNER_TEMP/release-inspect-error"); then
            [[ "$release_digest" = "$SOURCE_DIGEST" ]] || {
              echo "$release_image already points at $release_digest; refusing to overwrite"
              exit 1
            }
            echo "$release_image already published at $SOURCE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # An authentication/network failure is not evidence that a version
          # is available. Only a registry not-found response permits creation.
          if ! grep -Eqi 'not found|manifest unknown' "$RUNNER_TEMP/release-inspect-error"; then
            cat "$RUNNER_TEMP/release-inspect-error"
            exit 1
          fi
          source_ref="ghcr.io/${GITHUB_REPOSITORY}@${SOURCE_DIGEST}"
          docker buildx imagetools create --tag "$release_image" "$source_ref"
          release_digest=$(docker buildx imagetools inspect "$release_image" --format '{{.Manifest.Digest}}')
          [[ "$release_digest" = "$SOURCE_DIGEST" ]]
          echo "Released $release_image at $release_digest" >> "$GITHUB_STEP_SUMMARY"
