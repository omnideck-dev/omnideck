name: OmniDeck application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - ".dockerignore"
      - "container/**"
      - "desktop/**"
      - "pyproject.toml"
      - "server/**"
      - "uv.lock"
  push:
    tags:
      - "v*"

concurrency:
  group: omnideck-application-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install application dependencies
        working-directory: desktop
        run: npm ci

      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "${expected}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${expected}"
            exit 1
          }
          test -f "../docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "Missing release notes for ${GITHUB_REF_NAME}"
            exit 1
          }

      - name: Test application manager and setup game
        working-directory: desktop
        run: npm test

      # Launches the packaged entry point for real. The suite above stubs the
      # process boundary; this is what catches a window that never opens, a
      # preload that no longer matches, or a screen missing an element the
      # renderer writes to — none of which fail a unit test. podman is installed
      # so the container tool's real stream and exit-code behaviour is checked
      # too; nothing here pulls an image or starts a container.
      - name: Install a virtual display and the container tool
        run: sudo apt-get update && sudo apt-get install -y xvfb podman

      - name: Smoke test the application
        working-directory: desktop
        env:
          OMNIDECK_SMOKE_REQUIRE_PODMAN: "1"
        run: xvfb-run -a npm run test:app

  # The launch path on the other two platforms. Their runners have a real
  # display session, so no virtual one is needed. podman is deliberately absent:
  # this covers window creation, path handling and theme selection, which is the
  # platform-specific code that Linux cannot exercise.
  app_smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
          - name: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install application dependencies
        working-directory: desktop
        run: npm ci

      - name: Smoke test the application
        working-directory: desktop
        run: npm run test:app

  runtime_image:
    if: github.event_name != 'pull_request'
    needs: [test, app_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Pin runtime image
        id: image
        shell: bash
        run: |
          image_version=$(tr -d '\r\n' < desktop/container-version.txt)
          [[ "${image_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "container-version.txt must contain a plain X.Y.Z container release"
            exit 1
          }
          source_image="ghcr.io/${GITHUB_REPOSITORY}:${image_version}"
          digest=$(docker buildx imagetools inspect \
            "${source_image}" \
            --format '{{.Manifest.Digest}}' 2>/dev/null) || {
            echo "Container release ${source_image} does not exist"
            exit 1
          }
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Could not resolve ${source_image} to an immutable digest"
            exit 1
          }
          image_ref="ghcr.io/${GITHUB_REPOSITORY}@${digest}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          cd desktop
          node scripts/prepare-runtime-image.cjs "${image_ref}"

      - name: Upload runtime image manifest
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image-manifest
          path: desktop/build/runtime/image-manifest.json
          retention-days: 7
          if-no-files-found: error

  build:
    if: github.event_name != 'pull_request'
    needs: runtime_image
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            command: npm run dist:linux -- --x64
          - name: windows-x64
            runner: windows-2025
            command: npm run dist:windows -- --x64
          - name: macos-arm64
            runner: macos-15
            command: npm run dist:mac -- --arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Download runtime image manifest
        uses: actions/download-artifact@v8
        with:
          name: runtime-image-manifest
          path: desktop/build/runtime

      - name: Install application dependencies
        working-directory: desktop
        run: npm ci

      - name: Install Linux packaging tools
        if: matrix.name == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y binutils fakeroot rpm

      - name: Configure optional signing
        shell: bash
        env:
          TARGET_NAME: ${{ matrix.name }}
          MAC_CSC_LINK: ${{ secrets.DESKTOP_MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_MAC_CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.DESKTOP_WINDOWS_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_WINDOWS_CSC_KEY_PASSWORD }}
          NOTARIZE_APPLE_ID: ${{ secrets.DESKTOP_APPLE_ID }}
          NOTARIZE_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.DESKTOP_APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.DESKTOP_APPLE_TEAM_ID }}
        run: |
          append_env() {
            name="$1"
            value="$2"
            if [ -n "${value}" ]; then
              delimiter="OMNIDECK_SIGNING_VALUE_${name}"
              {
                echo "${name}<<${delimiter}"
                echo "${value}"
                echo "${delimiter}"
              } >> "${GITHUB_ENV}"
            fi
          }

          case "${TARGET_NAME}" in
            macos-arm64)
              if [ -n "${MAC_CSC_LINK}" ]; then
                append_env CSC_LINK "${MAC_CSC_LINK}"
                append_env CSC_KEY_PASSWORD "${MAC_CSC_KEY_PASSWORD}"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
                echo "Building unsigned macOS installer"
              fi
              append_env APPLE_ID "${NOTARIZE_APPLE_ID}"
              append_env APPLE_APP_SPECIFIC_PASSWORD "${NOTARIZE_APPLE_APP_SPECIFIC_PASSWORD}"
              append_env APPLE_TEAM_ID "${NOTARIZE_APPLE_TEAM_ID}"
              ;;
            windows-x64)
              if [ -n "${WINDOWS_CSC_LINK}" ]; then
                append_env CSC_LINK "${WINDOWS_CSC_LINK}"
                append_env CSC_KEY_PASSWORD "${WINDOWS_CSC_KEY_PASSWORD}"
              else
                echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "${GITHUB_ENV}"
                echo "Building unsigned Windows installer"
              fi
              ;;
          esac

      - name: Build installer
        working-directory: desktop
        run: ${{ matrix.command }}

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: node scripts/checksums.cjs dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-installers-${{ matrix.name }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.dmg
            desktop/dist/*.exe
            desktop/dist/*.rpm
            desktop/dist/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: omnideck-installers-*
          path: dist
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*

      # A tag carrying a suffix is a preview; a plain version is a release, and
      # the two are published differently. The application follows the same
      # rule when it looks for a newer version, so a tag that is a preview here
      # is a preview there too.
      - name: Classify the tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish OmniDeck release
        uses: softprops/action-gh-release@v3
        with:
          name: OmniDeck ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'false' }}
