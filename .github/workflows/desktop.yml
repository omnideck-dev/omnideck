name: omnideck application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "desktop/**"
      - "desktop/container-version.txt"
      - "docs/releases/**"
  push:
    tags:
      - "v*"

concurrency:
  group: omnideck-application-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            unzip

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify installer parity and vendored sidecars
        working-directory: desktop
        run: |
          pnpm run fetch:sidecars
          pnpm test

      - name: Test the Rust host
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Lint the Rust host
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate release version and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./desktop/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version v${version}"
            exit 1
          }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "Missing release notes for ${GITHUB_REF_NAME}"
            exit 1
          }

  runtime_image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Pin the runtime image
        shell: bash
        run: |
          image_version=$(tr -d '\r\n' < desktop/container-version.txt)
          [[ "${image_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "desktop/container-version.txt must contain a plain X.Y.Z release"
            exit 1
          }
          source_image="ghcr.io/${GITHUB_REPOSITORY}:${image_version}"
          digest=$(docker buildx imagetools inspect \
            "${source_image}" \
            --format '{{.Manifest.Digest}}' 2>/dev/null) || {
            echo "Container release ${source_image} does not exist"
            exit 1
          }
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Could not resolve ${source_image} to an immutable digest"
            exit 1
          }
          node desktop/scripts/prepare-runtime-image.mjs \
            "ghcr.io/${GITHUB_REPOSITORY}@${digest}"

      - name: Upload the runtime image manifest
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources/image-manifest.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: runtime_image
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            command: build:linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            command: build:linux:arm64
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            command: build:windows
          - name: windows-arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            command: build:windows:arm64
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            command: build:macos:x64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            command: build:macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils \
            fakeroot \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            unzip

      - name: Download the pinned runtime image manifest
        uses: actions/download-artifact@v8
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify the target sidecar set
        working-directory: desktop
        run: |
          pnpm run test:policy
          pnpm run fetch:sidecars -- ${{ matrix.target }}
          pnpm run verify:sidecars -- ${{ matrix.target }}

      - name: Build native installers
        working-directory: desktop
        run: pnpm run ${{ matrix.command }}

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: node scripts/checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload native installers
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-installers-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: omnideck-installers-*
          path: dist
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/**/*

      - name: Publish the preview release
        uses: softprops/action-gh-release@v3
        with:
          name: omnideck ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/**/*
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
