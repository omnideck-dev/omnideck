name: omnideck application

on:
  workflow_dispatch:
    inputs:
      signed_macos:
        description: Build signed and notarized macOS DMGs without publishing
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-hardware.yml"
      - ".github/workflows/desktop-release-contract.yml"
      - ".github/actionlint.yaml"
      - "desktop/**"
      - "desktop/container-version.txt"
      - "docs/releases/v*.md"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/desktop-hardware.yml"
      - ".github/workflows/desktop-release-contract.yml"
      - ".github/actionlint.yaml"
      - "desktop/**"
      - "desktop/container-version.txt"
      - "docs/releases/v*.md"

concurrency:
  group: omnideck-application-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Tauri system dependencies
        run: |
          bash .github/scripts/install-apt-packages.sh \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            unzip

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify installer parity and vendored sidecars
        working-directory: desktop
        run: |
          pnpm run fetch:sidecars
          pnpm test

      - name: Test the Rust host
        working-directory: desktop/src-tauri
        run: cargo test --locked

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Lint the Rust host
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Validate release version and notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Tag must be SemVer, for example v0.1.0-alpha.9 or v0.1.0"
            exit 1
          fi
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit=$(git rev-list -n 1 "${GITHUB_REF_NAME}")
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Desktop release tags must point to a commit already merged into main."
            exit 1
          fi
          version=$(node -p "require('./desktop/package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match desktop version v${version}"
            exit 1
          }
          test -s "docs/releases/${GITHUB_REF_NAME}.md" || {
            echo "Missing release notes for ${GITHUB_REF_NAME}"
            exit 1
          }
          node scripts/release-notes.mjs check-consumed --target desktop

  runtime_image:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Pin the runtime image
        shell: bash
        run: |
          image_version=$(tr -d '\r\n' < desktop/container-version.txt)
          [[ "${image_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "desktop/container-version.txt must contain a plain X.Y.Z release"
            exit 1
          }
          source_image="ghcr.io/${GITHUB_REPOSITORY}:${image_version}"
          digest=$(docker buildx imagetools inspect \
            "${source_image}" \
            --format '{{.Manifest.Digest}}' 2>/dev/null) || {
            echo "Container release ${source_image} does not exist"
            exit 1
          }
          [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Could not resolve ${source_image} to an immutable digest"
            exit 1
          }
          node desktop/scripts/prepare-runtime-image.mjs \
            "ghcr.io/${GITHUB_REPOSITORY}@${digest}"

      - name: Upload the runtime image manifest
        uses: actions/upload-artifact@v7
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources/image-manifest.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: runtime_image
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            command: build:linux
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            command: build:linux:arm64
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            command: build:windows
          - name: windows-arm64
            runner: windows-2025
            target: aarch64-pc-windows-msvc
            command: build:windows:arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-apt-packages.sh \
            binutils \
            fakeroot \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            unzip

      - name: Download the pinned runtime image manifest
        uses: actions/download-artifact@v8
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify the target sidecar set
        working-directory: desktop
        run: |
          pnpm run test:policy
          pnpm run fetch:sidecars -- ${{ matrix.target }}
          pnpm run verify:sidecars -- ${{ matrix.target }}

      - name: Build native installers
        working-directory: desktop
        env:
          # Tauri otherwise skips the Finder background and icon layout in CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: node scripts/build-with-retry.mjs ${{ matrix.command }}

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: node scripts/checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload native installers
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-installers-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  build_macos_preview:
    if: >-
      ${{
        !startsWith(github.ref, 'refs/tags/v') &&
        !(github.event_name == 'workflow_dispatch' && inputs.signed_macos)
      }}
    needs: runtime_image
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            command: build:macos:x64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            command: build:macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download the pinned runtime image manifest
        uses: actions/download-artifact@v8
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify the target sidecar set
        working-directory: desktop
        run: |
          pnpm run test:policy
          pnpm run fetch:sidecars -- ${{ matrix.target }}
          pnpm run verify:sidecars -- ${{ matrix.target }}

      - name: Build ad-hoc-signed macOS installer
        working-directory: desktop
        env:
          # Tauri otherwise skips the Finder background and icon layout in CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: node scripts/build-with-retry.mjs ${{ matrix.command }}

      - name: Verify the packaged macOS app signature
        working-directory: desktop
        run: ./scripts/verify-macos-bundle.sh ${{ matrix.target }}

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: node scripts/checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload native installer
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-installers-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  build_macos_release:
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') ||
        (github.event_name == 'workflow_dispatch' && inputs.signed_macos)
      }}
    needs: runtime_image
    timeout-minutes: 90
    environment: desktop-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            command: build:macos:x64
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            command: build:macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Download the pinned runtime image manifest
        uses: actions/download-artifact@v8
        with:
          name: runtime-image-manifest
          path: desktop/src-tauri/resources

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Verify the target sidecar set
        working-directory: desktop
        run: |
          pnpm run test:policy
          pnpm run fetch:sidecars -- ${{ matrix.target }}
          pnpm run verify:sidecars -- ${{ matrix.target }}

      - name: Configure Developer ID signing and notarization
        working-directory: desktop
        env:
          APPLE_TEAM_ID: 2FL6BUG8Q4
          DESKTOP_MAC_CERTIFICATE_P12_BASE64: ${{ secrets.DESKTOP_MAC_CERTIFICATE_P12_BASE64 }}
          DESKTOP_MAC_CERTIFICATE_PASSWORD: ${{ secrets.DESKTOP_MAC_CERTIFICATE_PASSWORD }}
          DESKTOP_APPLE_API_KEY_ID: ${{ secrets.DESKTOP_APPLE_API_KEY_ID }}
          DESKTOP_APPLE_API_ISSUER_ID: ${{ secrets.DESKTOP_APPLE_API_ISSUER_ID }}
          DESKTOP_APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.DESKTOP_APPLE_API_PRIVATE_KEY_BASE64 }}
        run: ./scripts/configure-macos-signing.sh

      - name: Build signed and notarized macOS installer
        working-directory: desktop
        env:
          # Tauri otherwise skips the Finder background and icon layout in CI.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: node scripts/build-with-retry.mjs ${{ matrix.command }}

      - name: Notarize and staple the final disk image
        working-directory: desktop
        run: ./scripts/notarize-macos-dmg.sh ${{ matrix.target }}

      - name: Verify Developer ID signature, notarization, and Gatekeeper trust
        working-directory: desktop
        run: ./scripts/verify-macos-bundle.sh ${{ matrix.target }} --require-developer-id 2FL6BUG8Q4

      - name: Remove release signing material
        if: always()
        working-directory: desktop
        run: ./scripts/cleanup-macos-signing.sh

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: node scripts/checksums.mjs src-tauri/target/${{ matrix.target }}/release/bundle

      - name: Upload signed native installer
        uses: actions/upload-artifact@v7
        with:
          name: omnideck-installers-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  artifact_contract:
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        (
          needs.build_macos_preview.result == 'success' ||
          needs.build_macos_release.result == 'success'
        )
      }}
    needs: [build, build_macos_preview, build_macos_release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download package matrix
        uses: actions/download-artifact@v8
        with:
          pattern: omnideck-installers-*
          path: dist
          merge-multiple: true

      - name: Verify release artifact contract
        shell: bash
        run: |
          version="v$(node -p "require('./desktop/package.json').version")"
          node desktop/tests/releasecontract/verify-release.mjs \
            --directory dist \
            --version "${version}" \
            --report artifacts/desktop-release-contract/report.json

      - name: Upload release contract report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release-contract-${{ github.run_id }}
          path: artifacts/desktop-release-contract/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build_macos_release, artifact_contract]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          pattern: omnideck-installers-*
          path: dist
          merge-multiple: true

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/**/*

      - name: Publish the preview release
        uses: softprops/action-gh-release@v3
        with:
          name: omnideck ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: dist/**/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
