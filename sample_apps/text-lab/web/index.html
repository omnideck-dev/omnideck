<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Text Lab</title>
    <link rel="stylesheet" href="app.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="eyebrow">FOLDER APP · PYTHON</div>
        <h1>Text Lab</h1>
        <p>Write something, inspect it, then reshape it with a backend action.</p>
      </header>

      <section class="workspace">
        <label for="text">Working text</label>
        <textarea id="text" spellcheck="true">The simplest useful app should feel like a folder you can open.</textarea>

        <div class="actions">
          <button id="analyze" class="primary">Analyze</button>
          <button id="ask-agent">Ask agent about this</button>
          <button data-mode="uppercase">Uppercase</button>
          <button data-mode="lowercase">Lowercase</button>
          <button data-mode="title">Title case</button>
          <button data-mode="collapse">Clean spacing</button>
        </div>

        <div id="status" class="status" aria-live="polite">Ready</div>
        <div id="metrics" class="metrics" hidden></div>
      </section>
    </main>

    <script src="/api/folder-apps/sdk.js"></script>
    <script src="app.js"></script>
  </body>
</html>
