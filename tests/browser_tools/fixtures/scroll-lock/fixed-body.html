<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixed body scroll lock</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      width: 100%;
    }

    main {
      min-height: 2600px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Fixed body scroll lock</h1>
    <p>Content begins here.</p>
    <p style="margin-top: 2200px">Content near the bottom.</p>
  </main>
</body>
</html>
