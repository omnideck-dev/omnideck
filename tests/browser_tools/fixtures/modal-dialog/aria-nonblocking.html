<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Non-blocking ARIA dialog</title>
  <style>
    body {
      margin: 0;
    }

    main {
      min-height: 3200px;
      padding: 24px;
    }

    #consent {
      background: white;
      border: 2px solid black;
      box-sizing: border-box;
      inset: 0;
      padding: 24px;
      position: fixed;
      z-index: 10;
    }

    body.banner #consent {
      inset: auto 0 0;
      height: 300px;
    }
  </style>
</head>
<body>
  <main>
    <h1>News</h1>
    <button type="button">Background action</button>
    <p>The document continues below the viewport.</p>
  </main>

  <div id="consent" role="dialog" aria-modal="true" aria-label="Privacy choices">
    <h2>Privacy choices</h2>
    <button type="button">Accept and continue</button>
  </div>

  <script>
    if (new URLSearchParams(location.search).get('layout') === 'banner') {
      document.body.classList.add('banner');
    }
  </script>
</body>
</html>
