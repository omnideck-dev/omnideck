<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cross-origin custom modal</title>
  <style>
    body {
      min-height: 2400px;
      overflow: hidden;
    }

    #modal-backdrop {
      background: rgb(0 0 0 / 55%);
      inset: 0;
      position: fixed;
      z-index: 2000;
    }

    #modal-backdrop button {
      position: absolute;
      right: 24px;
      top: 24px;
    }

    #modal-content {
      inset: 80px 0 0;
      pointer-events: none;
      position: fixed;
      text-align: center;
      z-index: 3000;
    }

    #modal-content iframe {
      background: white;
      border: 0;
      height: 90vh;
      pointer-events: auto;
      width: 24vw;
    }
  </style>
</head>
<body>
  <main>
    <h1>Playlist</h1>
    <button type="button">Background action</button>
  </main>

  <div id="modal-backdrop" class="auth-modal modal-overlay">
    <button id="auth-modal-close" type="button" title="Close">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16">
        <path d="M2 2l12 12M14 2L2 14"></path>
      </svg>
    </button>
  </div>
  <div id="modal-content">
    <iframe></iframe>
  </div>

  <script>
    document.querySelector('iframe').src =
      new URLSearchParams(location.search).get('src') || 'about:blank';
    document.getElementById('auth-modal-close').addEventListener('click', () => {
      document.getElementById('modal-backdrop').remove();
      document.getElementById('modal-content').remove();
      document.body.style.overflow = 'auto';
    });
  </script>
</body>
</html>
