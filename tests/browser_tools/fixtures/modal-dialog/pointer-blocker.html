<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pointer-blocking surface</title>
  <style>
    #glass {
      align-items: center;
      background: rgb(0 0 0 / 55%);
      display: flex;
      inset: 0;
      justify-content: center;
      position: fixed;
      z-index: 10;
    }

    #sheet {
      background: white;
      padding: 28px;
      width: 420px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Library</h1>
    <button type="button">Background action</button>
  </main>

  <!-- Deliberately has no dialog role, ARIA modal state, inert background,
       modal-ish id/class names, focus trap, or document scroll lock. -->
  <div id="glass">
    <section id="sheet">
      <h2>Before you continue</h2>
      <button id="continue-button" type="button">Continue to page</button>
    </section>
  </div>

  <script>
    document.getElementById('continue-button').addEventListener('click', () => {
      document.getElementById('glass').remove();
    });
  </script>
</body>
</html>
