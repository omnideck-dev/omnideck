<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Icon buttons</title></head>
<body>
  <h1>Icon buttons</h1>
  <!-- title-only icon button: named from the title attribute -->
  <button type="button" title="Titled icon"><svg width="16" height="16"></svg></button>
  <!-- aria-labelled icon button -->
  <button type="button" aria-label="Labelled icon"><svg width="16" height="16"></svg></button>
  <!-- icon button labelled by a nested <svg><title> -->
  <button type="button"><svg width="16" height="16"><title>SVG titled icon</title></svg></button>
</body>
</html>
