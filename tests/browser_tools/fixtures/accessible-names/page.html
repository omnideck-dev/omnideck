<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Accessible names</title>
</head>
<body>
  <h1>Names</h1>
  <button aria-label="Aria labelled button">X</button>
  <span id="lbl">Labelledby text</span>
  <button aria-labelledby="lbl">Y</button>
  <label for="in1">For-attr label</label>
  <input id="in1" type="text">
  <label>Wrapping label <input id="in2" type="text"></label>
  <input id="in3" type="text" placeholder="Placeholder name">
</body>
</html>
