<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select navigation</title></head>
<body>
  <h1>Location filter</h1>
  <label for="location">Location</label>
  <select id="location">
    <option value="">All locations</option>
    <option value="onsite">On site</option>
    <option value="remote"> Remote (US) </option>
  </select>
  <p id="result">No filter applied</p>
  <p id="events"></p>
  <p id="observed"></p>
  <script>
    const select = document.querySelector('#location');
    const params = new URLSearchParams(location.search);
    const selected = params.get('selected') || sessionStorage.getItem('location') || '';
    select.value = selected;
    if (selected === 'remote') document.querySelector('#result').textContent = 'Showing remote jobs';
    document.querySelector('#events').textContent =
      `Selection events: input=${sessionStorage.getItem('inputs') || 0}, change=${sessionStorage.getItem('changes') || 0}`;
    document.querySelector('#observed').textContent =
      `Observed selections: ${sessionStorage.getItem('selections') || ''}`;
    select.addEventListener('input', () => {
      sessionStorage.setItem('inputs', Number(sessionStorage.getItem('inputs') || 0) + 1);
    });
    select.addEventListener('change', () => {
      const selections = sessionStorage.getItem('selections');
      sessionStorage.setItem('selections', selections ? `${selections},${select.value}` : select.value);
      sessionStorage.setItem('changes', Number(sessionStorage.getItem('changes') || 0) + 1);
      sessionStorage.setItem('location', select.value);
      if (params.get('reload') === 'true') {
        location.reload();
      } else {
        params.set('selected', select.value);
        location.search = params.toString();
      }
    });
  </script>
</body>
</html>
