<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Select history update</title></head>
<body>
  <label for="location">Location</label>
  <select id="location" size="3">
    <option value="">All locations</option>
    <option value="onsite">On site</option>
    <option value="remote">Remote (US)</option>
  </select>
  <p id="result">No filter applied</p>
  <p id="observed"></p>
  <script>
    const select = document.querySelector('#location');
    const selections = [];
    select.addEventListener('change', () => {
      selections.push(select.value);
      history.replaceState(null, '', `?selected=${select.value}`);
      document.querySelector('#result').textContent = `Selected filter: ${select.value}`;
      document.querySelector('#observed').textContent = `Observed selections: ${selections.join(',')}`;
    });
  </script>
</body>
</html>
