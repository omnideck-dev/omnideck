<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Control states</title></head>
<body>
  <h1>Control states</h1>
  <input type="radio" id="rc" checked><label for="rc">Checked radio</label>
  <div role="tab" tabindex="0" aria-selected="true">Selected tab</div>
  <input type="tel" aria-label="Phone">
  <input type="text" value="prefilled value">
</body>
</html>
