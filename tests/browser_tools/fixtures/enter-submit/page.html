<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Key press</title>
</head>
<body>
  <h1>Key press</h1>
  <form id="f">
    <input id="q" type="text" aria-label="Query">
  </form>
  <div id="out">idle</div>
  <script>
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      document.getElementById('out').textContent =
        'Submitted: ' + document.getElementById('q').value;
    });
  </script>
</body>
</html>
