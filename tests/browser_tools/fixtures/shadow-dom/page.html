<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shadow DOM</title>
</head>
<body>
  <h1>Shadow host</h1>
  <my-widget></my-widget>
  <script>
    // Uses a CLOSED shadow root on purpose: the browser's open-shadow init
    // script should force it open so the DOM walker can pierce it. If that
    // stops working, these controls vanish from the page view.
    class MyWidget extends HTMLElement {
      constructor() {
        super();
        const root = this.attachShadow({ mode: 'closed' });
        root.innerHTML =
          '<button type="button">Shadow button</button>' +
          '<input type="text" aria-label="Shadow field">';
      }
    }
    customElements.define('my-widget', MyWidget);
  </script>
</body>
</html>
