<!doctype html>
<html><head><meta charset="utf-8"><title>bfix</title>
<style>
  html,body{margin:0;height:100%;font-family:sans-serif}
  #full{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        font-size:48px;box-sizing:border-box}
  #full input{font-size:40px;width:80%}
  #tall{height:5000px}
</style></head>
<body>
<div id="full"></div>
<script>
// Each mode renders one full-viewport target and signals back by *navigating*
// with a query param (the only channel the host test can observe, via the nav
// push to the address bar). Modes: click, input, link, file, copy, scroll.
(function(){
  var p=new URLSearchParams(location.search), mode=p.get('mode')||'idle';
  var full=document.getElementById('full');
  var here=location.pathname;
  function go(extra){ location.href=here+'?mode='+mode+'&'+extra; }
  if(mode==='click'){
    full.textContent='CLICK'; full.style.cursor='pointer';
    full.addEventListener('click', function(){ go('clicked=1'); });
  }else if(mode==='input'){
    var i=document.createElement('input'); i.id='inp';
    full.appendChild(i); i.focus();
    i.addEventListener('keydown', function(e){
      if(e.key==='Enter'){ e.preventDefault(); go('got='+encodeURIComponent(i.value)); }
    });
  }else if(mode==='link'){
    var a=document.createElement('a'); a.id='lnk';
    a.href=here+'?mode=click'; a.target='_blank'; a.textContent='OPEN TAB';
    a.style.cssText='position:fixed;inset:0;display:flex;align-items:center;'+
                    'justify-content:center;font-size:48px';
    document.body.appendChild(a);
  }else if(mode==='file'){
    var f=document.createElement('input'); f.type='file'; f.id='file';
    f.style.cssText='position:fixed;inset:0;font-size:40px';
    document.body.appendChild(f);
    f.addEventListener('change', function(){
      if(f.files[0]) go('got='+encodeURIComponent(f.files[0].name));
    });
  }else if(mode==='copy'){
    full.id='sel'; full.textContent='COPYME';
    var r=document.createRange(); r.selectNodeContents(full);
    var s=getSelection(); s.removeAllRanges(); s.addRange(r);
  }else if(mode==='scroll'){
    full.textContent='SCROLL';
    var t=document.createElement('div'); t.id='tall'; document.body.appendChild(t);
    window.addEventListener('scroll', function(){ if(window.scrollY>150) go('scrolled=1'); });
  }else{
    full.textContent='IDLE';
  }
})();
</script>
</body></html>
